[build]
  publish = "."
  # Maakt bij elke deploy de productpagina's (/product/...), /bedankt/ en sitemap.xml
  command = "node scripts/build.js"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
