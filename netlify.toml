[build]
  publish = "."
  # Maakt bij elke deploy de productpagina's (/product/...), /bedankt/ en sitemap.xml
  command = "node scripts/build.js"

[functions]
  # Mollie-afrekenen: checkout, mollie-webhook, order-status
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Broncode van functies en scripts niet als losse bestanden publiceren
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
